name: CI
on:
  pull_request:
  push:

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "CI base operativo"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present -- --watch=false
      - run: npm run build --if-present

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          
      - run: mvn -B -DskipTests=false verify

      - name: Auditoría con SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        run: mvn -B -Dsonar.projectKey=MauroMeza_dental-manager -Dsonar.organization=mauromeza -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ env.SONAR_TOKEN }} org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar
